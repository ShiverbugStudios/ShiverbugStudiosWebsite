name: Build and check

# Every page is generated by tools/build.py from src/ and data/, and committed,
# because GitHub Pages serves this repository as it is. This job builds the
# site again from source and fails if the result differs from what was
# committed, then runs the checker over the result.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Standard library only: no install step.
      - name: Build
        run: python tools/build.py

      - name: Fail if the committed site is out of date
        run: |
          untracked=$(git ls-files --others --exclude-standard)
          if [ -n "$untracked" ]; then
            echo "::error::The build wrote files that were never committed:"
            echo "$untracked"
            exit 1
          fi
          if ! git diff --quiet; then
            echo "::error::The committed site does not match its source. Run python tools/build.py and commit the result."
            git --no-pager diff --stat
            exit 1
          fi

      - name: Check
        run: python tools/check.py
